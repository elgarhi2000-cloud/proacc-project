services:
  - type: web
    name: proaccdb-app
    env: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: PORT
        value: "3000"
      - key: DB_SERVER
        value: "185.182.187.112"
      - key: DB_DATABASE
        value: "ProACCDB"
      - key: DB_USER
        value: "proacc"
      - key: DB_PASSWORD
        value: "proacc123"
      - key: DB_INSTANCE
        value: "SQLEXPRESS"
      - key: DB_ENCRYPT
        value: "false"
