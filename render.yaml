services:
  - type: web
    name: proaccdb-app
    env: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: PORT
        value: "3000"
      - key: DB_SERVER
        value: "your_db_server_here"
      - key: DB_DATABASE
        value: "your_database_name"
      - key: DB_USER
        value: "your_db_username"
      - key: DB_PASSWORD
        value: "your_db_password"
      - key: DB_INSTANCE
        value: "your_instance_name"
      - key: DB_ENCRYPT
        value: "false"
