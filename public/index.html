<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ProACCDB — قوائم الجداول</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <div class="logo-mark">P</div>
        <div class="logo-text" id="logo-text">ProACC</div>
      </div>
      <nav class="nav">
        <a class="nav-item active" href="#" data-route="dashboard"><span class="icon">📈</span><span class="label">اللوحة</span></a>
        <a class="nav-item" href="#" data-route="tables"><span class="icon">📄</span><span class="label">الجداول</span></a>
        <a class="nav-item" href="#" data-route="reports"><span class="icon">📊</span><span class="label">التقارير</span></a>
        <a class="nav-item" href="#" data-route="accounts"><span class="icon">💳</span><span class="label">دليل الحسابات</span></a>
      </nav>
      <div class="sidebar-footer">نسخة تجريبية</div>
    </aside>

    <div class="content">
      <header class="topbar">
        <div class="topbar-left">
          <button id="toggle-sidebar" class="icon-btn" title="طي/توسيع الشريط">☰</button>
          <h1>قائمة الجداول</h1>
        </div>
        <div class="topbar-right">
          <input id="search" placeholder="ابحث باسم الجدول..." />
          <button id="refresh" title="تحديث">⟳</button>
          <div class="user" id="user-area">المستخدم</div>
        </div>
      </header>

      <main class="main-area">
        <div class="card">
          <div id="status">جارٍ التحميل…</div>
          <div class="table-wrap">
            <table id="tables">
              <thead><tr><th>المخطط</th><th>اسم الجدول</th><th>إجراءات</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div id="accounts-card" class="card" style="display:none">
          <h2>دليل الحسابات</h2>
          <div class="accounts-actions"><button id="add-account">إضافة حساب</button></div>
          <div id="accounts-status">جارٍ التحميل…</div>
          <div class="table-wrap">
            <table id="accounts-table">
              <thead><tr></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <section id="details" class="card" aria-live="polite">
          <h2 id="details-title" style="display:none">محتوى الجدول</h2>
          <div id="details-area"></div>
        </section>
      </main>
    </div>
  </div>

  <!-- Settings panel -->
  <div id="settings-panel" class="settings-panel" aria-hidden="true">
    <div class="settings-card">
      <h3>إعداد الواجهة</h3>
      <label>لون أساسي: <input id="setting-primary" type="color" value="#6f42c1" /></label>
      <label>نص الشعار: <input id="setting-logo" type="text" value="ProACC" /></label>
      <div class="settings-actions">
        <button id="settings-save">حفظ</button>
        <button id="settings-close">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- Login panel -->
  <div id="login-panel" class="settings-panel" aria-hidden="true">
    <div class="settings-card">
      <h3>تسجيل الدخول</h3>
      <label>اسم المستخدم: <input id="login-username" type="text" /></label>
      <label>كلمة المرور: <input id="login-password" type="password" /></label>
      <div class="settings-actions">
        <button id="login-submit">دخول</button>
      </div>
      <div id="login-error" style="color:#c00;margin-top:8px;display:none"></div>
    </div>
  </div>

  <!-- Account form modal -->
  <div id="account-modal" class="settings-panel" aria-hidden="true">
    <div class="settings-card">
      <h3 id="account-modal-title">إضافة حساب</h3>
      <div id="account-form"></div>
      <div class="settings-actions">
        <button id="account-save">حفظ</button>
        <button id="account-cancel">إلغاء</button>
      </div>
      <div id="account-error" style="color:#c00;margin-top:8px;display:none"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
